<section class="page">
  <header class="page__header">
    <div>
      <h1 class="page__title">Categorías</h1>
      <p class="page__subtitle">Clasificaciones disponibles para tus eventos</p>
    </div>
    <a class="btn btn--primary" routerLink="nueva">Nueva categoría</a>
  </header>

  <p class="alert" *ngIf="error()">{{ error() }}</p>

  <div class="table-card" *ngIf="!loading(); else loadingState">
    <table class="table" *ngIf="categories().length; else emptyState">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th class="table__actions-col"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of categories()">
          <td class="table__name">{{ category.name }}</td>
          <td class="table__desc">{{ category.description || '—' }}</td>
          <td class="table__actions">
            <a class="link" [routerLink]="[category.id, 'editar']">Editar</a>
            <button
              type="button"
              class="link link--danger"
              [disabled]="deletingId() === category.id"
              (click)="remove(category)"
            >
              {{ deletingId() === category.id ? 'Eliminando…' : 'Eliminar' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #emptyState>
      <div class="empty">
        <p class="empty__title">Todavía no hay categorías</p>
        <p class="empty__subtitle">Crea la primera para empezar a clasificar tus eventos.</p>
        <a class="btn btn--primary" routerLink="nueva">Nueva categoría</a>
      </div>
    </ng-template>
  </div>

  <ng-template #loadingState>
    <div class="table-card table-card--loading">
      <div class="skeleton-row" *ngFor="let i of [1, 2, 3]"></div>
    </div>
  </ng-template>
</section>
